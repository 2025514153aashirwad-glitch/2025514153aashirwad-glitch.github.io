<script type="module">
import * as THREE from 'three';
import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';
import { HDRLoader } from 'three/addons/loaders/HDRLoader.js';

const W = 1920, H = 1080;

const mark = new THREE.Group(); const box = new THREE.Box3();

  }

const k = 1.36 / sz.y; const holder = new THREE.Group(); mark.position.set(-c.x, -c.y, 0); holder.add(mark); holder.scale.set(k, k, k * .16);

const key = new THREE.DirectionalLight(0xebf2ff, 1.6); key.position.set(-3.2, 1.15, -2.4); key.castShadow = true; key.shadow.mapSize.set(2048, 2048); sc.add(key);

const comp = new EffectComposer(r); comp.addPass(new RenderPass(sc, cam)); const ao = new GTAOPass(sc, cam, W, H); ao.updateGtaoMaterial({ radius: .08, distanceExponent: 1.5, thickness: 1, scale: 1.2 }); comp.addPass(ao);
comp.addPass(new BokehPass(sc, cam, { focus: cam.position.distanceTo(new THREE.Vector3(0, 0, -.05)), aperture: .0016, maxblur: .006 })); comp.addPass(new OutputPass());

window.READY = true;
</script></body></html>
