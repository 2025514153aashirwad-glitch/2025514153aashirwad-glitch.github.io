<!doctype html>
<html><head><meta charset="utf-8"><title>SAMATVA — The Vessel and the Light</title>
<style>
@font-face{font-family:Geist;src:url(fonts/Geist-Medium.woff2) format('woff2');font-weight:500}
@font-face{font-family:Geist;src:url(fonts/Geist-Regular.woff2) format('woff2');font-weight:400}
@font-face{font-family:GeistMono;src:url(fonts/GeistMono-Regular.woff2) format('woff2')}
@font-face{font-family:Inter;src:url(fonts/Inter-400.woff2) format('woff2')}
@font-face{font-family:Deva;src:url(fonts/NotoSansDevanagari.ttf) format('truetype');font-weight:100 900}
html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}
</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="common.js"></script>
<script>
const { clamp, lerp, seg, eio, eo, ei, hash, mulberry } = SK;
const W = 1920, H = 1080, cv = document.getElementById('c'), g = cv.getContext('2d');
window.DUR = 90.0; window.EV = [];
const INK = '#131313', MUTED = '#5C5C5C', GREY = '#A1A1AA';
// ------------------------------------------------------------- the photoreal plates (24 fps, 1920x1080, from Blender)
const SH = {
  reform: { t0: 17, len: 14, th: true, n: '01', name: 'REFORM', sub: 'The Seer’s Gateway', line: 'Seen, not steered.', lt: [26.0, 30.4] },
  build:  { t0: 31, len: 14, th: true, n: '02', name: 'BUILD', sub: 'The Builder’s Forge', line: 'Structure over noise.', lt: [39.6, 44.4] },
  gen:    { t0: 45, len: 13, th: true, n: '03', name: 'GENERATION', sub: 'The Producer’s Lattice', line: 'Return over extraction.', lt: [53.4, 57.4] },
  loop:   { t0: 58, len: 12, line: 'Standing over volume.', lt: [66.6, 69.6] },
  finale: { t0: 70, len: 12 },
};
const ORDER = ['reform', 'build', 'gen', 'loop', 'finale'];
const TH_LEN = 5.5, DRAIN = [3.4, 5.3];   // thermal opening, then the heat drains out of the metal
const cache = new Map();
function img(src) {
  if (cache.has(src)) return cache.get(src);
  const p = new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });
  cache.set(src, p); if (cache.size > 40) cache.delete(cache.keys().next().value); return p;
}
const plate = (name, pass, lt) => img(`plates24/${name}-${pass}/${String(Math.min(Math.floor(lt * 24) + 1, Math.round(SH[name].len * 24))).padStart(4, '0')}.jpg`);
// logo artwork, tinted
const ART = {}; for (const k of ['sun-full', 'sun-crescent']) ART[k] = img(`assets/${k}.svg`);
function tinted(im, col, w) {
  const h = w * im.height / im.width, o = document.createElement('canvas'); o.width = Math.ceil(w); o.height = Math.ceil(h);
  const c = o.getContext('2d'); c.drawImage(im, 0, 0, w, h); c.globalCompositeOperation = 'source-in'; c.fillStyle = col; c.fillRect(0, 0, w, h);
  // trim to the drawn pixels (the traced files keep the full artboard)
  const d = c.getImageData(0, 0, o.width, o.height).data; let x0 = o.width, y0 = o.height, x1 = 0, y1 = 0;
  for (let y = 0; y < o.height; y++) for (let x = 0; x < o.width; x++) if (d[(y * o.width + x) * 4 + 3] > 8) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  const t = document.createElement('canvas'); t.width = x1 - x0 + 1; t.height = y1 - y0 + 1; t.getContext('2d').drawImage(o, -x0, -y0); return t;
}
const TINT = new Map(); const tint = (k, im, col, w) => { const key = k + col + w; if (!TINT.has(key)) TINT.set(key, tinted(im, col, w)); return TINT.get(key); };
const ease = x => eio(clamp(x, 0, 1));
const fade = (t, a, b, f = .6) => clamp(Math.min((t - a) / f, (b - t) / f), 0, 1);
function text(s, x, y, font, col, a = 1, align = 'left', ls = 0) {
  if (a <= 0) return; g.save(); g.globalAlpha = a; g.font = font; g.fillStyle = col; g.textAlign = align; g.textBaseline = 'alphabetic';
  if (ls) g.letterSpacing = ls + 'px'; g.fillText(s, x, y); g.restore();
}
// ------------------------------------------------------------- 0–7 cold open: one drop, the ripple becomes the crescent, समत्व
async function coldOpen(t) {
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  const cx = W / 2, cy = H * .5;
  if (t > .9 && t < 1.6) { const k = (t - .9) / .7; const y = lerp(-40, cy, k * k); g.strokeStyle = 'rgba(255,240,220,.9)'; g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(cx, y - 70 * (1 - k * .5)); g.lineTo(cx, y); g.stroke(); }
  if (t > 1.55) {   // ripples on still water, seen at a low angle
    for (let i = 0; i < 4; i++) { const tt = t - 1.55 - i * .32; if (tt <= 0) continue; const r = 40 + tt * 260, a = clamp(1 - tt / 3.2, 0, 1) * (1 - i * .18);
      g.strokeStyle = `rgba(255,236,214,${.55 * a})`; g.lineWidth = 1.2; g.beginPath(); g.ellipse(cx, cy, r, r * .26, 0, 0, 7); g.stroke(); }
  }
  const om = fade(t, 2.0, 6.7, .9);
  if (om > 0) {   // the crescent rises out of the first ripple, then the word
    const im = await ART['sun-crescent']; if (im) { const o = tint('cr', im, '#F4EFE6', 330), k = ease((t - 2.0) / 1.6), y = lerp(cy - 10, cy - 60 - o.height / 2, k);
      g.save(); g.globalAlpha = om * k; g.drawImage(o, cx - o.width / 2, y); g.restore(); }
    text('समत्व', cx, cy + 6, '500 80px Deva', '#F4EFE6', fade(t, 2.6, 6.7, .9), 'center');
    text('TO STAND LEVEL', cx, cy + 210, '15px GeistMono', 'rgba(244,239,230,.7)', fade(t, 3.3, 6.6, .8), 'center', 6);
  }
}
// ------------------------------------------------------------- 7–17 the unseen: every light is someone noticing something
const PTS = (() => {
  const r = mulberry(11), out = [];
  const C = [[.62, .55, 1.0, 'BHARAT'], [.585, .385, .32, 'NEPAL'], [.26, .6, .62, 'NIGERIA']];
  for (const [x, y, s] of C) {
    for (let i = 0; i < 900 * s; i++) { const a = r() * 6.283, d = Math.pow(r(), 1.8) * .17 * Math.sqrt(s); out.push([x + Math.cos(a) * d * .9, y + Math.sin(a) * d * .62, r(), r()]); }
    for (let k = 0; k < 4 * s + 1; k++) {   // settlements strung along rivers and roads
      let px = x, py = y, ang = r() * 6.283;
      for (let i = 0; i < 70; i++) { ang += (r() - .5) * .5; px += Math.cos(ang) * .004; py += Math.sin(ang) * .0028; if (r() < .7) out.push([px + (r() - .5) * .006, py + (r() - .5) * .006, r(), r()]); }
    }
  }
  for (let i = 0; i < 700; i++) out.push([.05 + r() * .9, .1 + r() * .8, r(), r() * .4]);   // the scattered, unseen ones
  return { out, C };
})();
function unseen(t) {
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  const lt = t - 7, z = 1 + .07 * ease(lt / 10), ox = W * .5, oy = H * .5;
  g.save(); g.translate(ox, oy); g.scale(z, z); g.translate(-ox, -oy);
  for (const [x, y, a, b] of PTS.out) {
    const on = clamp((lt - .3 - a * 5.2) / .8, 0, 1); if (on <= 0) continue;
    const tw = .75 + .25 * Math.sin(lt * (1.3 + b * 2) + a * 40), br = (.28 + .7 * b) * on * tw;
    g.fillStyle = `rgba(255,${200 + 30 * b | 0},${150 + 40 * b | 0},${Math.min(1, br * 1.35)})`; const s = .9 + b * 1.3; g.fillRect(x * W - s / 2, y * H - s / 2, s, s);
  }
  // one thin line joins the three; labels in small mono
  const L = PTS.C, k = ease((lt - 6.2) / 2.4);
  if (k > 0) { g.strokeStyle = `rgba(244,239,230,${.45 * fade(lt, 6.2, 10.5, .5)})`; g.lineWidth = 1; g.beginPath();
    const seq = [L[2], L[0], L[1]], tot = 2, s = k * tot; g.moveTo(seq[0][0] * W, seq[0][1] * H);
    for (let i = 1; i < 3; i++) { const f = clamp(s - (i - 1), 0, 1); if (f <= 0) break; g.lineTo(lerp(seq[i - 1][0], seq[i][0], f) * W, lerp(seq[i - 1][1], seq[i][1], f) * H); } g.stroke(); }
  L.forEach(([x, y, , name], i) => { const a = fade(lt, 5.6 + i * .35, 10.4, .5); text(name, x * W + 18, y * H - 14, '13px GeistMono', 'rgba(244,239,230,.85)', a, 'left', 4);
    if (a > 0) { g.fillStyle = `rgba(244,239,230,${a})`; g.fillRect(x * W - 2, y * H - 2, 4, 4); } });
  g.restore();
  g.fillStyle = `rgba(0,0,0,${clamp((lt - 9.3) / .7, 0, 1)})`; g.fillRect(0, 0, W, H);   // hand over to the first chapter
}
// ------------------------------------------------------------- the plates, with the heat draining out of the metal
const off = document.createElement('canvas'); off.width = W; off.height = H; const og = off.getContext('2d');
async function chapter(name, t) {
  const S = SH[name], lt = t - S.t0;
  const metal = await plate(name, 'metal', lt); if (metal) g.drawImage(metal, 0, 0, W, H);
  if (S.th && lt < DRAIN[1]) {
    const th = await plate(name, 'thermal', Math.min(lt, TH_LEN - 1 / 24));
    if (th) {   // heat retreats toward its source: a soft, uneven edge closing in
      const k = ease((lt - DRAIN[0]) / (DRAIN[1] - DRAIN[0])), R = lerp(1500, 0, k);
      og.clearRect(0, 0, W, H); og.globalCompositeOperation = 'source-over'; og.drawImage(th, 0, 0, W, H);
      og.globalCompositeOperation = 'destination-in';
      const hx = W * .52, hy = H * .42, gr = og.createRadialGradient(hx, hy, R * .25, hx, hy, R + 1);
      gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(.7, 'rgba(0,0,0,.85)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
      og.fillStyle = gr; og.fillRect(0, 0, W, H); g.drawImage(off, 0, 0);
    }
  }
  // chapter kicker, top left
  if (S.n) { const a = fade(lt, .5, 6.2, .7); text(`${S.n}   ${S.name}`, 120, 120, '15px GeistMono', '#fff', a, 'left', 5); text(S.sub, 120, 152, '400 20px Geist', 'rgba(255,255,255,.66)', a); }
  // the principle, lower left
  if (S.line) { const a = fade(t, S.lt[0], S.lt[1], .7), dy = 10 * (1 - ease((t - S.lt[0]) / .9)); text(S.line, 120, H - 128 + dy, '500 44px Geist', '#fff', a, 'left', -.8); }
  if (name === 'loop') {   // the four classes, each lit as it is named; all the same size
    const C = ['CITIZEN', 'STUDENT', 'PARAPROFESSIONAL', 'PROFESSIONAL'], base = fade(t, 59.0, 68.6, .6);
    C.forEach((c, i) => { const on = clamp((t - (59.6 + i * 1.18)) / .35, 0, 1); text(c, W - 120, H - 250 + i * 36, '14px GeistMono', `rgba(255,255,255,${.38 + .62 * on})`, base, 'right', 5); });
    text('Equal standing.', W - 120, H - 92, '500 28px Geist', '#fff', fade(t, 65.0, 68.6, .5), 'right');
  }
  if (name === 'finale') text('BHARAT   ·   NEPAL   ·   NIGERIA', W / 2, H - 96, '15px GeistMono', 'rgba(255,255,255,.85)', fade(t, 72.4, 79.4, .8), 'center', 6);
}
// ------------------------------------------------------------- 82–90 end card, in the site’s editorial style
async function endCard(t) {
  const lt = t - 82; g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
  const im = await ART['sun-full']; const a = ease(lt / 1.2);
  if (im) { const o = tint('sun', im, INK, 190), s = 1.03 - .03 * a; g.save(); g.globalAlpha = a; g.translate(W / 2, 340); g.scale(s, s); g.drawImage(o, -o.width / 2, -o.height / 2); g.restore(); }
  text('SAMATWAM', W / 2 + 6, 590, '500 30px Geist', INK, ease((lt - 1.0) / .9), 'center', 13);
  text('Uniting People, Building Systems', W / 2, 668, '500 56px Geist', INK, ease((lt - 2.0) / .9), 'center', -1.1);
  text('BUILD  |  GENERATION  |  REFORM      ·      ACCESS: BHARAT  |  NEPAL  |  NIGERIA', W / 2, 742, '14px GeistMono', MUTED, ease((lt - 3.2) / 1), 'center', 3);
  // the cut from the dark studio lands on white; soften the first frames
  g.fillStyle = `rgba(0,0,0,${clamp(1 - lt / .35, 0, 1)})`; g.fillRect(0, 0, W, H);
}
const FONTS = Promise.all(['500 44px Geist', '400 20px Geist', '15px GeistMono', '14px Inter', '500 116px Deva'].map(f => document.fonts.load(f, 'Aa समत्व')));
window.render = async function (t) {
  await FONTS; await document.fonts.ready;
  if (t < 7) return coldOpen(t);
  if (t < 17) { unseen(t); if (t > 16.2) { g.save(); g.globalAlpha = ease((t - 16.2) / .8); await chapter('reform', 17); g.restore(); } return; }
  if (t >= 82) return endCard(t);
  let cur = ORDER.find(n => t >= SH[n].t0 && t < SH[n].t0 + SH[n].len);
  await chapter(cur, t);
  // a short dissolve across each chapter cut
  const nxt = ORDER[ORDER.indexOf(cur) + 1];
  if (nxt) { const tc = SH[nxt].t0, a = clamp((t - (tc - .3)) / .3, 0, 1); if (a > 0 && t < tc) { g.save(); g.globalAlpha = a; await chapter(nxt, tc); g.restore(); } }
  if (cur === 'finale' && t > 81.2) { g.fillStyle = `rgba(0,0,0,${ease((t - 81.2) / .8)})`; g.fillRect(0, 0, W, H); }
};
window.TEXTS = t => [];
window.READY = true;
</script></body></html>
