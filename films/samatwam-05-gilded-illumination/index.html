<body><canvas id="c" width="1920" height="1080"></canvas>

<script>
const { clamp, lerp, seg, eio, eo, ei, back, hash, F } = SK;
const W = 1920, H = 1080, BEAT = 1.0;     // 60 BPM

const PG = { ultra: ['#16246e', '#22379a', '#3a52b8'], verm: ['#8e1f12', '#c8321f', '#f0b8a4'], verd: ['#24584b', '#3f8f7a', '#bfe2d4'], rose: ['#9a4a58', '#d97a8a', '#f6d2d8'], azure: ['#3b6fae', '#6f9fd6', '#d8e6f6'], lilac: ['#5d5873', '#8f8aa6', '#e2dff0'], ochre: ['#7a5a2a', '#b88a48', '#ecd2a4'], ink: '#2a1a10', white: '#fbf3e2', vellum: '#efe2c4' };

let PU = null, PV = null;
// ---------------------------------------------------------------- page layout (world units; page 1600 × 1000, centred)
const PW = 1600, PH = 1000;
const SCENES = [{ x: -470, y: -230, kind: 'bench' }, { x: -110, y: -230, kind: 'cross' }, { x: -470, y: 190, kind: 'teach' }, { x: -110, y: 190, kind: 'field' }];
const GRID = { x: 330, y: -370, w: 360, h: 690, cols: 6, rows: 12 };   // the builder's map: 12 months down, 6 disciplines across
// the builder's year: [row(month), col(discipline), stage 1..4]; two works were held (stage 4)
const MARKS = []; { const R = SK.mulberry(5); for (let r = 0; r < 12; r++) for (let c = 0; c < 6; c++) { const v = R(); if (v < .42) MARKS.push([r, c, v < .16 ? 1 : v < .3 ? 2 : 3]); } }
MARKS.push([3, 2, 4], [9, 4, 4]);
const HELD_TAB = [{ x: -405, y: -170, w: 84, h: 64 }, { x: -40, y: 250, w: 84, h: 64 }];   // the gold tablets beside the two held works
// ---------------------------------------------------------------- camera
const CK = [[0, -363, -138, 9.0], [1.2, -363, -138, 8.2], [5, -300, -60, 1.05], [5.6, -470, -230, 1.7], [8.4, -470, -230, 1.75], [9.4, -110, -230, 1.7], [12.0, -110, -230, 1.75], [13.0, -470, 190, 1.7], [15.6, -470, 190, 1.75], [16.6, -110, 190, 1.7], [19.6, -110, 190, 1.75],
  [21.4, 510, -25, 1.25], [27.4, 510, -25, 1.32], [29.6, 0, 0, 1.0], [36, 0, 0, 1.0], [50, 0, 0, 1.03], [52.4, 150, -330, 3.6], [55.6, 150, -330, 3.6], [56.0, 150, -330, 3.6], [57.2, 0, 0, 1.05], [60, 0, 0, 1.08]];
function cam(t) { let i = 0; while (i < CK.length - 2 && t > CK[i + 1][0]) i++; const a = CK[i], b = CK[i + 1], u = eio(seg(t, a[0], b[0]) || 0);
  const base = { x: lerp(a[1], b[1], u), y: lerp(a[2], b[2], u), s: Math.exp(lerp(Math.log(a[3]), Math.log(b[3]), u)) };

let C = null;
// ---------------------------------------------------------------- the painting recipe: fill, inner rim shade, firm ink outline, white-lead edge
function paint(path, body, rim, hi, lw = 3.2) {

const P = (pts) => () => { g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); };
const Circ = (x, y, r) => () => { g.beginPath(); g.arc(x, y, r, 0, 7); };
function dots(x, y, n, r, col = PG.white) { g.fillStyle = col; for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; g.beginPath(); g.arc(x + Math.cos(a) * r, y + Math.sin(a) * r, 1.6, 0, 7); g.fill(); } }

}
function spires(x, y, n, col) { for (let i = 0; i < n; i++) { const xx = x + i * 26, h = 50 + 40 * hash(i * 3 + x); paint(P([[xx - 16, y], [xx - 8, y - h * .6], [xx - 2, y - h * .62], [xx + 4, y - h], [xx + 12, y - h * .7], [xx + 16, y]]), PG[col][1], PG[col][0], PG[col][2], 2.6); } }

    g.strokeStyle = PG.white; g.lineWidth = 2; g.beginPath(); g.moveTo(x - 90, y - 10); g.lineTo(x - 52, y - 16); g.moveTo(x - 90, y + 4); g.lineTo(x - 60, y + 2); g.stroke();

    paint(P([[x + 60, y + 10], [x + 110, y + 10], [x + 110, y + 18], [x + 60, y + 18]]), PG.lilac[1], PG.lilac[0], null, 2.2);

}
// ---------------------------------------------------------------- gold leaf: squares, seams, bole, punched dots; light only on gold
let LAMP = null;
const LKEYS = [[36.4, -760, -150], [39.7, -363, -138], [41.4, -200, 60], [43.5, 2, 282], [46.4, 480, -169], [48.4, 600, 176], [49.6, 760, 220]];
function lampAt(t) { let i = 0; while (i < LKEYS.length - 2 && t > LKEYS[i + 1][0]) i++; const a = LKEYS[i], b = LKEYS[i + 1], u = eio(seg(t, a[0], b[0])); return [lerp(a[1], b[1], u), lerp(a[2], b[2], u)]; }
function gold(x, y, w, h, key, laid = 1) {

    g.fillStyle = 'rgba(40,20,5,.55)'; g.fillRect(sx, sy, sw, .8); g.fillRect(sx, sy, .8, sh);                 // seam

      g.beginPath(); g.moveTo(cx - L2, cy); g.lineTo(cx + L2, cy); g.moveTo(cx, cy - L2); g.lineTo(cx, cy + L2); g.stroke(); }
  }

  g.fillStyle = 'rgba(50,28,8,.75)'; for (let i = 6; i < w - 4; i += 7) { g.beginPath(); g.arc(x + i, y + 6, 1.2, 0, 7); g.arc(x + i, y + h - 6, 1.2, 0, 7); g.fill(); }

}
// ---------------------------------------------------------------- frame, sky, quatrefoil, woven map
function quatrefoil(cx, cy, r, fill) { return () => { g.beginPath(); for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2; g.arc(cx + Math.cos(a) * r * .5, cy + Math.sin(a) * r * .5, r * .55, a - Math.PI / 2 - .2, a + Math.PI / 2 + .2); } g.closePath(); }; }
function face(cx, cy, r) {
  paint(Circ(cx, cy, r * .55), PG.rose[2], PG.rose[0], null, 2.4);
  paint(P([[cx - r * .55, cy - r * .1], [cx - r * .5, cy - r * .5], [cx, cy - r * .62], [cx + r * .5, cy - r * .5], [cx + r * .55, cy - r * .1], [cx + r * .4, cy - r * .3], [cx - r * .4, cy - r * .3]]), PG.ochre[0], '#3a2410', null, 2.2);
  g.fillStyle = PG.ink; g.beginPath(); g.arc(cx - r * .2, cy, 2.6, 0, 7); g.arc(cx + r * .2, cy, 2.6, 0, 7); g.fill();

}
function woven(t) {
  const { x, y, w, h, cols, rows } = GRID, cw = w / cols, rh = h / rows;
  paint(P([[x - 16, y - 16], [x + w + 16, y - 16], [x + w + 16, y + h + 16], [x - 16, y + h + 16]]), '#1b2a7a', '#101a52', null, 3);

  g.lineWidth = 3;
  for (let i = 0; i < rows + 1; i++) { const u = clamp(kw * 1.4 - i * .03); if (u <= 0) continue; g.strokeStyle = i % 3 ? '#c9b48a' : PG.white; g.beginPath(); g.moveTo(x, y + i * rh); g.lineTo(x + w * eo(u), y + i * rh); g.stroke(); }

function page(t) {

function backSide(t) {   // the plain back of the cloth: vellum, the threads seen from behind, no pictures
  PV.setTransform(new DOMMatrix().scale(1 / C.s)); g.fillStyle = PV; g.fillRect(-PW / 2, -PH / 2, PW, PH);

function frame(t) {

  LAMP = null; if (t > 35.6 && t < 50.4) { const lp = lampAt(t); LAMP = { x: lp[0], y: lp[1] - 10, a: seg(t, 35.6, 36.4) * (1 - seg(t, 49.6, 50.4)) }; }
