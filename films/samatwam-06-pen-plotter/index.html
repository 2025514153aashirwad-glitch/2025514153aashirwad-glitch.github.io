<script>

const SW = 1400, SH = 820;
let C = null;
function setCam(T, az, el, d) { const ca = Math.cos(el), P = [T[0] + d * Math.sin(az) * ca, d * Math.sin(el), T[1] + d * Math.cos(az) * ca];

const K = (x, y, az, el, d) => ({ x, y, az: az * Math.PI / 180, el: el * Math.PI / 180, d });
const CK = [[0, K(310, 345, 0, 72, 330)], [3.6, K(310, 345, 0, 70, 420)], [8, K(320, 360, 0, 62, 1050)], [12, K(470, 360, -6, 58, 1250)], [33.6, K(500, 360, -4, 58, 1300)],
  [35.4, K(1180, 260, 0, 50, 900)], [37.4, K(1060, 300, 0, 54, 980)], [39.6, K(720, 560, 0, 60, 1150)], [41, K(560, 690, 0, 64, 1050)], [49.4, K(600, 690, 0, 64, 1100)],
  [51.0, K(280, 380, -18, 16, 640)], [55.2, K(280, 380, 8, 18, 660)], [56.4, K(1200, 430, 0, 88, 760)], [60, K(1200, 430, 0, 88, 790)]];

  return K(lerp(a.x, b.x, u), lerp(a.y, b.y, u), lerp(a.az, b.az, u) * 180 / Math.PI, lerp(a.el, b.el, u) * 180 / Math.PI, lz(a.d, b.d, u)); }

// ---------------------------------------------------------------- the glyph on a 5 × 7 grid: crown (arena, 2 bits), body (root, 4 bits), base (stage, 2 bits), spine notches (sight, 3 bits)
const CELL = 60;

const G0 = { x: 130, y: 120 };
const MAIN = glyph(G0.x, G0.y, 1);

const PROG = [];
const add = (pts, ink, t0, t1, part = null, lift = 0) => PROG.push({ pts, ink, t0, t1, part, lift });

add([[G0.x + 2 * CELL, G0.y + 3 * CELL], [G0.x + 2 * CELL + .5, G0.y + 3 * CELL]], 'k', 2.0, 2.3);

const grid = []; for (let c = 0; c <= 5; c++) grid.push([[G0.x - .5 * CELL + c * CELL, G0.y - .5 * CELL], [G0.x - .5 * CELL + c * CELL, G0.y + 6.5 * CELL]]);

// the glyph, part by part, each followed by its single-line label
const LX = 560, LBL = [];
const label = (txt, x, y, size, ink, t0, t1, id) => LBL.push({ txt, x, y, size, ink, t0, t1, id });

PROG.sort((a, b) => a.t0 - b.t0);
// rack positions (pens stand in a rack at the sheet's right edge)
const RACK = { k: [1440, 120], grey: [1440, 200], red: [1440, 280] };
// pen position (sheet units) and whether it is down, and which ink is loaded
function penAt(t) {

    const u = seg(t, 34, 36.8); const a = [LX + 640, 520], r1 = RACK.k, r2 = RACK.red;

function along(pts, u) { let L = 0; const d = []; for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); d.push(l); L += l; } let r = L * u;

// ---------------------------------------------------------------- drawing
function strokeProj(pts, u, ink, w, liftH) {

function desk() {
  g.fillStyle = '#0d0b09'; g.fillRect(0, 0, W, H);
  // the desk (dark wood), the sheet (cream), the lamp's warm pool
  const corners = (x0, y0, x1, y1) => [proj(x0, y0), proj(x1, y0), proj(x1, y1), proj(x0, y1)];
  const poly = pts => { g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); };
  const dk = corners(-900, -700, 2400, 1700); if (dk.every(p => p[2] > 1)) { g.fillStyle = '#2a1d14'; poly(dk); g.fill(); }
  g.save(); g.filter = 'blur(10px)'; g.fillStyle = 'rgba(0,0,0,.5)'; poly(corners(10, 14, SW + 16, SH + 20)); g.fill(); g.restore();
  g.fillStyle = '#F1ECDF'; poly(corners(0, 0, SW, SH)); g.fill();

  g.save(); poly(corners(0, 0, SW, SH)); g.clip(); g.fillStyle = gr; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 400; i++) { const p = proj(hash(i * 3.1) * SW, hash(i * 7.3) * SH); g.fillStyle = `rgba(120,100,70,${.05 * hash(i)})`; g.fillRect(p[0], p[1], 2, 1); } g.restore();
}
function rack(t, pen) {
  for (const [ink, [x, y]] of Object.entries(RACK)) { const held = pen.ink === ink && !(t >= 34 && t < 36.8 && Math.abs(pen.x - x) < 2 && Math.abs(pen.y - y) < 2);
    const b = proj(x, y), tp = proj(x, y, held ? 0 : 90); g.fillStyle = '#3a3a3e'; g.beginPath(); g.ellipse(b[0], b[1], 16, 8, 0, 0, 7); g.fill();
    if (!held) { g.strokeStyle = INK[ink]; g.lineWidth = 14; g.lineCap = 'round'; g.beginPath(); g.moveTo(b[0], b[1]); g.lineTo(tp[0], tp[1]); g.stroke(); } }
}
function gantry(pen) {
  const H0 = 70, ys = pen.y, rl = proj(-60, ys, H0), rr = proj(SW + 140, ys, H0);
  // side rails
  g.strokeStyle = '#55575c'; g.lineWidth = 10; [[-60], [SW + 140]].forEach(([x]) => { const a = proj(x, -40, 30), b = proj(x, SH + 40, 30); g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); });
  // the bridge and its shadow
  const sl = proj(-60 + 30, ys + 40, 0), sr = proj(SW + 170, ys + 40, 0); g.strokeStyle = 'rgba(0,0,0,.18)'; g.lineWidth = 22; g.beginPath(); g.moveTo(sl[0], sl[1]); g.lineTo(sr[0], sr[1]); g.stroke();
  g.strokeStyle = '#8b8e94'; g.lineWidth = 18; g.beginPath(); g.moveTo(rl[0], rl[1]); g.lineTo(rr[0], rr[1]); g.stroke();
  g.strokeStyle = '#c9ccd1'; g.lineWidth = 3; g.beginPath(); g.moveTo(rl[0], rl[1] - 6); g.lineTo(rr[0], rr[1] - 6); g.stroke();

  g.strokeStyle = INK[pen.ink]; g.lineWidth = 12; g.lineCap = 'butt'; g.beginPath(); g.moveTo(top[0], top[1]); g.lineTo(bot[0], bot[1]); g.stroke();

      g.font = F(500, 21, 'SG'); g.letterSpacing = '0px'; const u2 = seg(t, 57.6, 58.6); g.save(); g.beginPath(); g.rect(-4, 20, 380 * u2, 60); g.clip(); g.strokeStyle = INK.red; g.lineWidth = 1.4; g.strokeText('Build it. Prove it. Give it back.', 0, 60); g.restore();
      const u3 = seg(t, 58.0, 58.9); g.font = F(500, 14, 'SG'); g.save(); g.beginPath(); g.rect(-4, 80, 380 * u3, 40); g.clip(); g.strokeStyle = INK.k; g.lineWidth = 1; g.strokeText('Samatwam Org · Toward Viksit Bharat 2047', 0, 104); g.restore(); g.letterSpacing = '0px'; });
    if (t > 58.2) { const a = proj(1040, 490), b = proj(1640, 670); SK.reg('end', 'SAMATWAM Build it. Prove it. Give it back. Samatwam Org · Toward Viksit Bharat 2047', a[0], a[1], b[0], b[1], true); } }

  SK.subs(g, t, CAP, VO, VOD, { box: 'rgba(14,12,10,.82)', en: '#f4ede0', hi: '#cdc3b1' });
  return pen;
}
