<!doctype html><html><head><meta charset="utf-8"><title>Studio T1 Boot</title></head><body><div id="stage"></div>

<script>
// T1 · Boot: a liquid-chrome mark settles, drops into the taskbar, the taskbar rises and the studio opens.
window.DUR = 8;
STUDIO(async () => {
  const D = desktop('d'); const { a, bw, tb } = D;
  const icons = [tb.L, ...Object.values(tb.icons)];
  gsap.set(D.field.glows, { opacity: 0, scale: .8 }); gsap.set(tb.b, { y: 170, opacity: 0 }); gsap.set(icons, { y: 34, opacity: 0 });

  const M = chromeMark(420); const mx = (W - M.w) / 2, my = 250; gsap.set(M.wrap, { left: mx, top: my, opacity: 0, scale: .86, transformOrigin: '50% 50%' });
  const title = div('t big', { position: 'absolute', left: 0, width: W + 'px', top: '722px', textAlign: 'center', fontSize: '64px', color: '#F5F3EE' }, stage, [...'Samatwam Studio'].map(c => `<span style="display:inline-block;white-space:pre">${c}</span>`).join(''));
  const sub = div('t', { position: 'absolute', left: 0, width: W + 'px', top: '810px', textAlign: 'center', fontSize: '22px', color: 'rgba(245,243,238,.55)' }, stage, 'The workshop, opening');
  gsap.set(title.children, { opacity: 0, y: 22, '--b': 10 }); gsap.set(sub, { opacity: 0, y: 12 });
  const live = { liquid: 150 };
  tl.to(M.wrap, { opacity: 1, duration: 1.0, ease: 'power2.out' }, .2).to(M.wrap, { scale: 1, duration: 2.2, ease: 'glide' }, .2).to(live, { liquid: 0, duration: 2.4, ease: 'soft' }, .2)

  const r = tb.L.getBoundingClientRect(), tx = r.left + 32 - (mx + M.w / 2), ty = r.top - 170 + 32 - (my + 210);
  tl.to(M.wrap, { x: tx, y: ty, scale: 40 / 420, duration: 1.0, ease: 'drop' }, 3.4).to(live, { liquid: 40, duration: .5, ease: 'power2.in' }, 3.4).to(live, { liquid: 0, duration: .6, ease: 'soft' }, 3.9)

    .to(icons, { y: 0, opacity: 1, duration: .8, ease: 'snap', stagger: .05 }, 3.8).to(M.wrap, { opacity: 0, duration: .25 }, 4.45)

  const Q = 'Summarise the Bisahda water pump trial and draft the field report';
  perFrame.push(t => { M.set(live.liquid, ramp(t, 0, 4.4) * .9); sheen(icons, t, 4.5, .9, .07); const n = Math.round(Q.length * ramp(t, 5.4, 6.9)); a.q.textContent = Q.slice(0, n) + (t > 5.3 && t < 7.4 && Math.floor(t * 2.2) % 2 ? '|' : ''); });

  stage.appendChild(M.wrap); stage.appendChild(title); stage.appendChild(sub);
});
