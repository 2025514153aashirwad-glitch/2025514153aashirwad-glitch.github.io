<!doctype html><html><head><meta charset="utf-8"><title>Studio T5 Choreography</title></head><body><div id="stage"></div>
<script src="../shared/motion.js"></script><script src="../shared/gsap.min.js"></script><script src="../shared/studio.js"></script>
<script>
// T5 · Choreography: app tiles arrive in a bento grid; one expands into a full window, then folds into its taskbar icon.
window.DUR = 8.6;
STUDIO(async () => {
  const D = desktop('d'); D.a.w.style.display = D.bw.w.style.display = 'none'; const tb = D.tb;
  const apps = [['build', 'Build Record', '41 / 44', 'Tests passed on BR-0142'], ['agent', 'Samatwam Agent', '3', 'Records waiting for review'], ['arena', 'Simulation Arena', '12', 'Scenarios running tonight'], ['ring', 'Ring', '7.4 h', 'Calm focus logged today']];
  const G = { x: 330, y: 120, w: 610, h: 370, g: 40 };
  const tiles = apps.map(([k, name, v, cap], i) => { const x = G.x + (i % 2) * (G.w + G.g), y = G.y + Math.floor(i / 2) * (G.h + G.g);
    const w = div('win', { left: x + 'px', top: y + 'px', width: G.w + 'px', height: G.h + 'px' }, D.root);
    const hd = div('', { position: 'absolute', left: '32px', top: '30px', display: 'flex', alignItems: 'center', gap: '16px' }, w);
    const ic = div('icon', { width: '48px', height: '48px', borderRadius: '14px' }, hd, svgGlyph(k)); ic.querySelector('svg').style.cssText = 'left:11px;top:11px;width:26px;height:26px'; div('sh', {}, ic);
    div('t', { fontSize: '22px', fontWeight: 500 }, hd, name);
    const big = div('t big', { position: 'absolute', left: '32px', bottom: '74px', fontSize: '88px' }, w, v); div('t', { position: 'absolute', left: '34px', bottom: '40px', fontSize: '18px', opacity: .55 }, w, cap);
    return { k, w, x, y, ic, big }; });
  // the expanded detail for Build Record and Arena
  const detail = (t, rows) => { const d = div('', { position: 'absolute', left: '32px', top: '112px', width: '1000px', opacity: 0 }, t.w); rows.forEach(([a, b]) => { const r = div('', { display: 'flex', alignItems: 'center', gap: '14px', height: '58px', borderTop: '1px solid rgba(var(--ink),.08)' }, d); div('saff', { width: '3px', height: '20px', borderRadius: '2px' }, r); div('t', { fontSize: '19px', opacity: .85, flex: 1 }, r, a); div('t', { fontSize: '16px', opacity: .45 }, r, b); }); return d; };
  const dB = detail(tiles[0], [['Prototype soldered and logged', 'Mon 09:12'], ['Moisture sensor calibrated in Bisahda', 'Tue 16:40'], ['Peer review requested', 'Today 08:55'], ['Three tests left: heat, dust, night drain', 'Due Friday']]);
  const dA = detail(tiles[2], [['Monsoon runoff, Bisahda fields', 'Running'], ['Pump duty cycle at 40 percent', 'Queued'], ['Grid outage, six hours', 'Queued'], ['Night drain on battery pack', 'Done']]);
  gsap.set(tiles.map(t => t.w), { opacity: 0, y: 60, scale: .94, '--b': 12 });
  tl.to(tiles.map(t => t.w), { opacity: 1, y: 0, scale: 1, '--b': 0, duration: 1, ease: 'reveal', stagger: .09 }, .2);
  const FULL = { left: 330, top: 110, width: 1260, height: 800 };
  const folded = new Set();
  function expandFold(T, d, t0) { const others = tiles.filter(o => o !== T && !folded.has(o)).map(o => o.w); folded.add(T); const ir = tb.icons[T.k].getBoundingClientRect();
    tl.set(T.w, { zIndex: 5 }, t0).to(T.w, { ...Object.fromEntries(Object.entries(FULL).map(([k, v]) => [k, v + 'px'])), duration: .9, ease: 'snap' }, t0)
      .to(T.big, { fontSize: '120px', duration: .9, ease: 'snap' }, t0).to(d, { opacity: 1, y: 0, duration: .6, ease: 'reveal' }, t0 + .35).fromTo(d, { y: 20 }, { y: 0, duration: .6, ease: 'reveal' }, t0 + .35)
      .to(others, { opacity: .25, scale: .96, '--b': 10, duration: .7, ease: 'glide' }, t0)
      // fold into the taskbar icon
      .to(T.w, { left: ir.left + 'px', top: ir.top + 'px', width: '64px', height: '64px', borderRadius: '18px', opacity: 0, duration: .8, ease: 'drop' }, t0 + 1.9)
      .to([d, T.big], { opacity: 0, duration: .25 }, t0 + 1.9)
      .to(others, { opacity: 1, scale: 1, '--b': 0, duration: .8, ease: 'reveal' }, t0 + 2.2)
      .to(tb.icons[T.k], { y: -16, duration: .22, ease: 'power2.out' }, t0 + 2.55).to(tb.icons[T.k], { y: 0, duration: .7, ease: 'drop' }, t0 + 2.77);
    const dot = div('', { position: 'absolute', width: '5px', height: '5px', borderRadius: '3px', background: '#F2B766', left: (ir.left + 29.5) + 'px', top: (ir.top + 69) + 'px', opacity: 0 }, D.root);
    tl.to(dot, { opacity: 1, duration: .3 }, t0 + 2.6); }
  expandFold(tiles[0], dB, 1.6); expandFold(tiles[2], dA, 4.6);
  // the remaining tiles re-centre
  const rest = [tiles[1], tiles[3]]; tl.to(rest[0].w, { left: G.x + 'px', top: (H - G.h) / 2 - 70 + 'px', duration: 1, ease: 'snap' }, 6.9).to(rest[1].w, { top: (H - G.h) / 2 - 70 + 'px', duration: 1, ease: 'snap' }, 6.96);
  perFrame.push(t => { sheen(tiles.map(t => t.ic), t, .9, .9, .08); sheen(Object.values(tb.icons), t, 6.9, .9, .05); });
});
</script></body></html>
